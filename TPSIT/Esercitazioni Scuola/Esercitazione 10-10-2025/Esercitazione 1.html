<!DOCTYPE html>
<html lang="it">
<head>
    <title>Es Javascript 1</title>
    <script>
        
        let A=prompt("Inserisci un numero")*1;
        let B=prompt("Inserisci un altro numero")*1;
        let operazione= prompt("Inserisci l'operazione (+, -, *, /)");

        switch(operazione){
            case "+":
                alert(A+B);
                break;
            case "-":
                alert(A-B);
                break;
            case "*":
                alert(A*B);
                break;
            case "/":
                if(B!=0){
                    alert(A/B);
                } else {
                    alert("Errore: divisione per zero");
                }
                break;
            default:
                alert("Operazione non valida");
        }
    </script>
</head>
<body>
    
</body>
</html>
