name: Build SchoolHub Windows EXE

on:
  push:
    branches:
      - schoolhub-build
    paths:
      - ".github/workflows/build-schoolhub.yml"
      - ".schoolhub-build/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify SchoolHub source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $b64 = [System.Text.StringBuilder]::new()

          for ($i = 0; $i -le 12; $i++) {
            $plain = ".schoolhub-build\source.part{0:D2}" -f $i
            $hex = "$plain.hex"

            if (Test-Path $plain) {
              $text = (Get-Content $plain -Raw).Trim()
            } elseif (Test-Path $hex) {
              $hexText = (Get-Content $hex -Raw).Trim()
              $text = [System.Text.Encoding]::UTF8.GetString([Convert]::FromHexString($hexText))
            } else {
              throw "Missing source bundle part $i"
            }

            [void]$b64.Append($text)
          }

          $bytes = [Convert]::FromBase64String($b64.ToString())
          [IO.File]::WriteAllBytes("schoolhub_source_bundle.tar.xz", $bytes)

          $actualHash = (Get-FileHash "schoolhub_source_bundle.tar.xz" -Algorithm SHA256).Hash.ToLower()
          $expectedHash = "10382cf92c94723083168561a58b7d2438fe8696e4bb0635e5323f91bb1d260d"
          if ($actualHash -ne $expectedHash) {
            throw "Source bundle SHA256 mismatch: $actualHash"
          }

          tar -xf "schoolhub_source_bundle.tar.xz"

          if (!(Test-Path "src\schoolhub_gui.py")) { throw "schoolhub_gui.py missing" }
          if (!(Test-Path "src\workspace.py")) { throw "workspace.py missing" }
          if (!(Test-Path "tests\test_schoolhub.py")) { throw "test suite missing" }
          if (!(Test-Path "SchoolHub.spec")) { throw "SchoolHub.spec missing" }

          # Normalize two fault-injection predicates for Windows Path semantics.
          # This changes only the tests, not SchoolHub production code.
          $testPath = "tests\\test_schoolhub.py"
          $testText = Get-Content $testPath -Raw
          $testText = $testText.Replace("if Path(src)==self.wp and '.creating-cleanup-' in str(dst):", "if '.creating-cleanup-' in os.fspath(dst):")
          $testText = $testText.Replace("if Path(src)==self.wp and '.locking-cleanup-' in str(dst):", "if '.locking-cleanup-' in os.fspath(dst):")
          Set-Content $testPath $testText -Encoding UTF8

          Select-String -Path "src\schoolhub_gui.py" -Pattern 'if __name__ == "__main__"' -Quiet |
            ForEach-Object { if (-not $_) { throw "GUI entry point missing" } }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Bundle Git for Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $gitCmd = (Get-Command git.exe).Source
          $gitRoot = Split-Path (Split-Path $gitCmd -Parent) -Parent
          Write-Host "Bundling Git from: $gitRoot"

          if (!(Test-Path (Join-Path $gitRoot "cmd\git.exe"))) {
            throw "Could not determine Git for Windows root"
          }

          New-Item -ItemType Directory -Force "vendor" | Out-Null
          Copy-Item $gitRoot "vendor\git" -Recurse -Force

          if (!(Test-Path "vendor\git\cmd\git.exe")) {
            throw "Bundled git.exe missing"
          }

          & "vendor\git\cmd\git.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Git cannot start" }

      - name: Run source test suite
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Source tests failed" }

      - name: Build one-file Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m PyInstaller --clean --noconfirm SchoolHub.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          if (!(Test-Path "dist\SchoolHub.exe")) { throw "SchoolHub.exe was not produced" }
          Get-Item "dist\SchoolHub.exe" | Format-List Name,Length,FullName

      - name: Self-test compiled EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $PWD "dist\selftest.json"
          $p = Start-Process ".\dist\SchoolHub.exe" -ArgumentList @("--self-test", $out) -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            if (Test-Path $out) { Get-Content $out -Raw | Write-Host }
            throw "EXE self-test exited with code $($p.ExitCode)"
          }
          if (!(Test-Path $out)) { throw "Self-test result missing" }

          $result = Get-Content $out -Raw | ConvertFrom-Json
          $result | ConvertTo-Json -Depth 8

          if (-not $result.ok) { throw "EXE self-test reported failure: $($result.error)" }
          if (-not $result.checks.vault_roundtrip) { throw "Vault round-trip failed" }
          if (-not $result.checks.git_bundled) { throw "EXE did not use bundled Git" }

      - name: GUI startup smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $p = Start-Process ".\dist\SchoolHub.exe" -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()

          if ($p.HasExited) {
            throw "SchoolHub GUI exited during startup (code $($p.ExitCode))"
          }

          Stop-Process -Id $p.Id -Force

      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash ".\dist\SchoolHub.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  SchoolHub.exe" | Set-Content ".\dist\SchoolHub.exe.sha256.txt" -Encoding ASCII
          Get-Content ".\dist\SchoolHub.exe.sha256.txt"

      - name: Upload final executable
        uses: actions/upload-artifact@v4
        with:
          name: SchoolHub-Windows-OneFile
          path: |
            dist/SchoolHub.exe
            dist/SchoolHub.exe.sha256.txt
            dist/selftest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
