name: Build SchoolHub Windows EXE

on:
  push:
    branches:
      - schoolhub-build
    paths:
      - ".github/workflows/build-schoolhub.yml"
      - ".schoolhub-v2.2/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify SchoolHub 2.2 source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $parts = Get-ChildItem ".schoolhub-v2.2\source.part*" | Sort-Object Name
          if ($parts.Count -ne 31) { throw "Expected 31 SchoolHub 2.2 source parts, got $($parts.Count)" }

          $b64 = [System.Text.StringBuilder]::new()
          foreach ($part in $parts) {
            [void]$b64.Append((Get-Content $part.FullName -Raw).Trim())
          }

          $bytes = [Convert]::FromBase64String($b64.ToString())
          [IO.File]::WriteAllBytes("schoolhub_v2_2_source.tar.xz", $bytes)
          $actualHash = (Get-FileHash "schoolhub_v2_2_source.tar.xz" -Algorithm SHA256).Hash.ToLower()
          $expectedHash = "11a25bb9e4b54868a2754b15d3c665b5384fb24cc06946a3fb0f29af6f135ba8"
          if ($actualHash -ne $expectedHash) { throw "Source bundle SHA256 mismatch: $actualHash" }

          tar -xf "schoolhub_v2_2_source.tar.xz"
          @(
            "src\schoolhub_gui.py",
            "src\workspace.py",
            "tests\test_schoolhub.py",
            "tests\test_media_streaming.py",
            "SchoolHub.spec",
            "VERSION.txt",
            "schoolhub.ico",
            "schoolhub_icon.png"
          ) | ForEach-Object { if (!(Test-Path $_)) { throw "Missing source file: $_" } }

      - name: Privacy audit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          import pathlib, re
          root = pathlib.Path(".")
          files = [root/"src"/"schoolhub_gui.py", root/"src"/"workspace.py"]
          forbidden = {
              "GitHub PAT": re.compile(r"github_pat_[A-Za-z0-9_]{20,}"),
              "GitHub classic token": re.compile(r"gh[pousr]_[A-Za-z0-9]{20,}"),
              "private key": re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
          }
          for p in files:
              text = p.read_text(encoding="utf-8")
              for label, pattern in forbidden.items():
                  if pattern.search(text):
                      raise SystemExit(f"Privacy audit failed: {label} found in {p}")
          gui = (root/"src"/"schoolhub_gui.py").read_text(encoding="utf-8")
          if 'DEFAULT_REMOTE = ""' not in gui:
              raise SystemExit("Privacy audit failed: default data remote must be empty")
          if '"auto_sync": False' not in gui:
              raise SystemExit("Privacy audit failed: auto sync must default to false")
          if 'APP_VERSION = "2.2.0"' not in gui:
              raise SystemExit("Version constant mismatch")
          print("Privacy audit OK")
          '@ | Set-Content ".schoolhub-v2.2\privacy_audit.py" -Encoding UTF8
          python ".schoolhub-v2.2\privacy_audit.py"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Normalize Windows test harness
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Media test imports: unittest discovery on Windows does not inherit the
          # path injection performed by test_schoolhub.py.
          $media = "tests\test_media_streaming.py"
          $text = Get-Content $media -Raw
          $text = $text.Replace("from pathlib import Path", "from pathlib import Path`r`nimport sys`r`nsys.path.insert(0, str(Path(__file__).resolve().parents[1] / 'src'))")
          Set-Content $media $text -Encoding UTF8

          # Fault-injection tests compare Path objects differently on Windows.
          # Match the cleanup destination instead; product code is untouched.
          $testPath = "tests\test_schoolhub.py"
          $lines = Get-Content $testPath
          $patched = foreach ($line in $lines) {
            $indent = [regex]::Match($line, '^\s*').Value
            if ($line -match "\.creating-cleanup-" -and $line -match "^\s*if ") {
              $indent + "if '.creating-cleanup-' in os.fspath(dst):"
            } elseif ($line -match "\.locking-cleanup-" -and $line -match "^\s*if ") {
              $indent + "if '.locking-cleanup-' in os.fspath(dst):"
            } else {
              $line
            }
          }
          $patched | Set-Content $testPath -Encoding UTF8

      - name: Bundle Git for Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $gitCmd = (Get-Command git.exe).Source
          $gitRoot = Split-Path (Split-Path $gitCmd -Parent) -Parent
          if (!(Test-Path (Join-Path $gitRoot "cmd\git.exe"))) { throw "Could not determine Git for Windows root" }
          New-Item -ItemType Directory -Force "vendor" | Out-Null
          Copy-Item $gitRoot "vendor\git" -Recurse -Force
          & "vendor\git\cmd\git.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Git cannot start" }

      - name: Run source test suite
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Source tests failed" }

      - name: Build one-file Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m PyInstaller --clean --noconfirm SchoolHub.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          if (!(Test-Path "dist\SchoolHub.exe")) { throw "SchoolHub.exe was not produced" }
          Get-Item "dist\SchoolHub.exe" | Format-List Name,Length,FullName

      - name: Self-test compiled EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $PWD "dist\selftest.json"
          $p = Start-Process ".\dist\SchoolHub.exe" -ArgumentList @("--self-test", $out) -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            if (Test-Path $out) { Get-Content $out -Raw | Write-Host }
            throw "EXE self-test exited with code $($p.ExitCode)"
          }
          $result = Get-Content $out -Raw | ConvertFrom-Json
          $result | ConvertTo-Json -Depth 8
          if (-not $result.ok) { throw "EXE self-test reported failure" }
          if (-not $result.checks.vault_roundtrip) { throw "Vault round-trip failed" }
          if (-not $result.checks.media_streaming) { throw "Media streaming encryption failed" }
          if (-not $result.checks.git_bundled) { throw "EXE did not use bundled Git" }
          if (-not $result.checks.safe_default_remote) { throw "Unsafe default remote" }
          if ($result.checks.version -ne "2.2.0") { throw "Unexpected EXE version" }

      - name: GUI startup smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $p = Start-Process ".\dist\SchoolHub.exe" -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          if ($p.HasExited) { throw "SchoolHub GUI exited during startup (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force

      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash ".\dist\SchoolHub.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  SchoolHub.exe" | Set-Content ".\dist\SchoolHub.exe.sha256.txt" -Encoding ASCII
          Get-Content ".\dist\SchoolHub.exe.sha256.txt"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolHub-Windows-OneFile-v2.2.0
          path: |
            dist/SchoolHub.exe
            dist/SchoolHub.exe.sha256.txt
            dist/selftest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish auto-update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "schoolhub-v2.2.0"
          $title = "SchoolHub 2.2.0"
          $notes = @"
          SchoolHub 2.2.0

          - Nuova interfaccia grafica e icona SchoolHub.
          - Versione visibile nelle Impostazioni e controllo aggiornamenti integrato.
          - Nuova finestra password con mostra/nascondi e conferma.
          - Finestra di avanzamento con percentuale, fase reale, file corrente e tempo trascorso.
          - Cifratura SHENC2 a blocchi per immagini, audio, video e file grandi.
          - Compatibilità in lettura con i Vault SHENC1 precedenti.
          - Git con timeout massimo: niente sync infinite.
          - Clone shallow per ridurre tempi e traffico.
          - Repository dati pubblico bloccato; nessun repository dati predefinito.
          - Aggiornamento automatico verificato SHA-256 senza reinstallazione.
          - Git for Windows incorporato nell'EXE.
          - 20 test sorgente + self-test EXE + smoke test GUI Windows.
          "@

          if (gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null) {
            gh release upload $tag ".\dist\SchoolHub.exe#SchoolHub.exe" ".\dist\SchoolHub.exe.sha256.txt#SchoolHub.exe.sha256.txt" --clobber --repo "$env:GITHUB_REPOSITORY"
            gh release edit $tag --title $title --notes $notes --latest --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create $tag ".\dist\SchoolHub.exe#SchoolHub.exe" ".\dist\SchoolHub.exe.sha256.txt#SchoolHub.exe.sha256.txt" --target "$env:GITHUB_SHA" --title $title --notes $notes --latest --repo "$env:GITHUB_REPOSITORY"
          }
