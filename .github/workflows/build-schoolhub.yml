name: Build SchoolHub Windows EXE

on:
  push:
    branches:
      - schoolhub-build
    paths:
      - ".github/workflows/build-schoolhub.yml"
      - ".schoolhub-v2.2/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 55

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct SchoolHub source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $parts = Get-ChildItem ".schoolhub-v2.2\source.part*" | Sort-Object Name
          if ($parts.Count -ne 31) { throw "Expected 31 source parts, got $($parts.Count)" }
          $b64 = [System.Text.StringBuilder]::new()
          foreach ($part in $parts) {
            [void]$b64.Append((Get-Content $part.FullName -Raw).Trim())
          }
          $bytes = [Convert]::FromBase64String($b64.ToString())
          [IO.File]::WriteAllBytes("schoolhub_source.tar.xz", $bytes)
          $actualHash = (Get-FileHash "schoolhub_source.tar.xz" -Algorithm SHA256).Hash.ToLower()
          $expectedHash = "11a25bb9e4b54868a2754b15d3c665b5384fb24cc06946a3fb0f29af6f135ba8"
          if ($actualHash -ne $expectedHash) { throw "Source bundle SHA256 mismatch: $actualHash" }
          tar -xf "schoolhub_source.tar.xz"
          @("src\schoolhub_gui.py","src\workspace.py","tests\test_schoolhub.py","tests\test_media_streaming.py","SchoolHub.spec","VERSION.txt","schoolhub.ico","schoolhub_icon.png") |
            ForEach-Object { if (!(Test-Path $_)) { throw "Missing source file: $_" } }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install Pillow

      - name: Patch SchoolHub 2.3 startup splash
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
from pathlib import Path
from PIL import Image, ImageDraw, ImageFont

root = Path(".")
gui_path = root / "src" / "schoolhub_gui.py"
spec_path = root / "SchoolHub.spec"

gui = gui_path.read_text(encoding="utf-8")
if 'APP_VERSION = "2.2.0"' not in gui:
    raise SystemExit("APP_VERSION marker not found")
gui = gui.replace('APP_VERSION = "2.2.0"', 'APP_VERSION = "2.3.0"', 1)

marker = "root.mainloop()"
if gui.count(marker) != 1:
    raise SystemExit(f"Expected one root.mainloop(), got {gui.count(marker)}")
replacement = """try:
        import pyi_splash
        if pyi_splash.is_alive():
            pyi_splash.update_text("SchoolHub pronto")
            pyi_splash.close()
    except Exception:
        pass

    root.mainloop()"""
gui = gui.replace(marker, replacement, 1)
gui_path.write_text(gui, encoding="utf-8")
(root / "VERSION.txt").write_text("2.3.0\n", encoding="utf-8")

logo = Image.open(root / "schoolhub_icon.png").convert("RGBA")
canvas = Image.new("RGBA", (680, 410), (8, 17, 32, 255))
draw = ImageDraw.Draw(canvas)
draw.rounded_rectangle((8, 8, 671, 401), radius=34, fill=(10, 24, 44, 255), outline=(35, 124, 255, 255), width=2)
draw.rounded_rectangle((34, 326, 646, 358), radius=16, fill=(17, 39, 67, 255), outline=(43, 103, 177, 255), width=1)
draw.rounded_rectangle((36, 328, 286, 356), radius=14, fill=(20, 121, 255, 255))
logo.thumbnail((185, 185), Image.Resampling.LANCZOS)
canvas.alpha_composite(logo, ((680-logo.width)//2, 38))

def font(size, bold=False):
    candidates = [
        "C:/Windows/Fonts/segoeuib.ttf" if bold else "C:/Windows/Fonts/segoeui.ttf",
        "C:/Windows/Fonts/arialbd.ttf" if bold else "C:/Windows/Fonts/arial.ttf",
    ]
    for candidate in candidates:
        try:
            return ImageFont.truetype(candidate, size)
        except Exception:
            pass
    return ImageFont.load_default()

title_font = font(36, True)
sub_font = font(16, False)
small_font = font(12, False)

title = "SchoolHub"
box = draw.textbbox((0, 0), title, font=title_font)
draw.text(((680-(box[2]-box[0]))/2, 225), title, fill=(244, 248, 255, 255), font=title_font)
subtitle = "Preparazione ambiente sicuro..."
box = draw.textbbox((0, 0), subtitle, font=sub_font)
draw.text(((680-(box[2]-box[0]))/2, 276), subtitle, fill=(161, 188, 220, 255), font=sub_font)
draw.text((34, 374), "SchoolHub 2.3.0  -  Avvio applicazione", fill=(119, 151, 188, 255), font=small_font)
canvas.convert("RGB").save(root / "schoolhub_splash.png", "PNG")

spec = spec_path.read_text(encoding="utf-8")
if "Splash(" in spec:
    raise SystemExit("Spec already has Splash")
exe_marker = "exe = EXE("
idx = spec.find(exe_marker)
if idx < 0:
    raise SystemExit("EXE target not found")

splash_block = """splash = Splash(
    'schoolhub_splash.png',
    binaries=a.binaries,
    datas=a.datas,
    text_pos=(46, 344),
    text_size=10,
    text_color='#d7e8ff',
    text_font='Segoe UI',
    minify_script=True,
    always_on_top=True,
)

"""
spec = spec[:idx] + splash_block + spec[idx:]
open_pos = spec.find("(", spec.find(exe_marker))
spec = spec[:open_pos+1] + "\n    splash,\n    splash.binaries," + spec[open_pos+1:]
spec_path.write_text(spec, encoding="utf-8")

print("SchoolHub 2.3 startup splash patch OK")
'@ | Set-Content ".schoolhub-v2.2\patch_23.py" -Encoding UTF8
          python ".schoolhub-v2.2\patch_23.py"
          if (!(Test-Path "schoolhub_splash.png")) { throw "Splash image missing" }
          Select-String -Path "SchoolHub.spec" -Pattern "Splash\(" | Write-Host
          Select-String -Path "SchoolHub.spec" -Pattern "splash.binaries" | Write-Host

      - name: Normalize Windows tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
from pathlib import Path

media = Path("tests/test_media_streaming.py")
text = media.read_text(encoding="utf-8-sig")
if "sys.path.insert" not in text:
    text = text.replace(
        "from pathlib import Path",
        "from pathlib import Path\nimport sys\nsys.path.insert(0, str(Path(__file__).resolve().parents[1] / 'src'))",
        1,
    )
media.write_text(text, encoding="utf-8")

p = Path("tests/test_schoolhub.py")
lines = p.read_text(encoding="utf-8-sig").splitlines()
out = []
for line in lines:
    indent = line[:len(line)-len(line.lstrip())]
    if ".creating-cleanup-" in line and line.lstrip().startswith("if "):
        out.append(indent + "if '.creating-cleanup-' in os.fspath(dst):")
    elif ".locking-cleanup-" in line and line.lstrip().startswith("if "):
        out.append(indent + "if '.locking-cleanup-' in os.fspath(dst):")
    else:
        out.append(line)
p.write_text("\n".join(out) + "\n", encoding="utf-8")
'@ | Set-Content ".schoolhub-v2.2\normalize_tests.py" -Encoding UTF8
          python ".schoolhub-v2.2\normalize_tests.py"

      - name: Privacy and version audit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
import pathlib, re
root = pathlib.Path(".")
files = [root/"src"/"schoolhub_gui.py", root/"src"/"workspace.py"]
patterns = [
    re.compile(r"github_pat_[A-Za-z0-9_]{20,}"),
    re.compile(r"gh[pousr]_[A-Za-z0-9]{20,}"),
    re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
]
for p in files:
    text = p.read_text(encoding="utf-8")
    for pattern in patterns:
        if pattern.search(text):
            raise SystemExit(f"Privacy audit failed in {p}")
gui = (root/"src"/"schoolhub_gui.py").read_text(encoding="utf-8")
if 'DEFAULT_REMOTE = ""' not in gui:
    raise SystemExit("default remote must be empty")
if '"auto_sync": False' not in gui:
    raise SystemExit("auto sync must default off")
if 'APP_VERSION = "2.3.0"' not in gui:
    raise SystemExit("version mismatch")
spec = (root/"SchoolHub.spec").read_text(encoding="utf-8")
if "Splash(" not in spec or "splash.binaries" not in spec:
    raise SystemExit("boot splash missing from spec")
print("Privacy/version/splash audit OK")
'@ | Set-Content ".schoolhub-v2.2\audit_23.py" -Encoding UTF8
          python ".schoolhub-v2.2\audit_23.py"

      - name: Bundle Git for Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $gitCmd = (Get-Command git.exe).Source
          $gitRoot = Split-Path (Split-Path $gitCmd -Parent) -Parent
          if (!(Test-Path (Join-Path $gitRoot "cmd\git.exe"))) { throw "Could not determine Git root" }
          New-Item -ItemType Directory -Force "vendor" | Out-Null
          Copy-Item $gitRoot "vendor\git" -Recurse -Force
          & "vendor\git\cmd\git.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Git cannot start" }

      - name: Run source test suite
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Source tests failed" }

      - name: Build one-file Windows EXE with instant splash
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m PyInstaller --clean --noconfirm SchoolHub.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          if (!(Test-Path "dist\SchoolHub.exe")) { throw "SchoolHub.exe missing" }
          Get-Item "dist\SchoolHub.exe" | Format-List Name,Length,FullName

      - name: Self-test compiled EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $PWD "dist\selftest.json"
          $p = Start-Process ".\dist\SchoolHub.exe" -ArgumentList @("--self-test", $out) -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            if (Test-Path $out) { Get-Content $out -Raw | Write-Host }
            throw "EXE self-test failed with code $($p.ExitCode)"
          }
          $result = Get-Content $out -Raw | ConvertFrom-Json
          $result | ConvertTo-Json -Depth 8
          if (-not $result.ok) { throw "EXE self-test reported failure" }
          if (-not $result.checks.vault_roundtrip) { throw "Vault test failed" }
          if (-not $result.checks.media_streaming) { throw "Media streaming test failed" }
          if (-not $result.checks.git_bundled) { throw "Bundled Git test failed" }
          if (-not $result.checks.safe_default_remote) { throw "Remote privacy test failed" }
          if ($result.checks.version -ne "2.3.0") { throw "Unexpected version $($result.checks.version)" }

      - name: GUI startup smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $p = Start-Process ".\dist\SchoolHub.exe" -PassThru
          Start-Sleep -Seconds 10
          $p.Refresh()
          if ($p.HasExited) { throw "SchoolHub GUI exited during startup (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force

      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash ".\dist\SchoolHub.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  SchoolHub.exe" | Set-Content ".\dist\SchoolHub.exe.sha256.txt" -Encoding ASCII
          Get-Content ".\dist\SchoolHub.exe.sha256.txt"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolHub-Windows-OneFile-v2.3.0
          path: |
            dist/SchoolHub.exe
            dist/SchoolHub.exe.sha256.txt
            dist/selftest.json
            schoolhub_splash.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish auto-update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "schoolhub-v2.3.0"
          $title = "SchoolHub 2.3.0"
          $notes = @"
          SchoolHub 2.3.0

          - Splash immediata dal momento del doppio clic.
          - Attività di estrazione visibile durante l'avvio one-file.
          - La splash resta finché la finestra principale SchoolHub è pronta.
          - Mantiene la grafica, la finestra password e le barre operative di SchoolHub 2.2.
          - Versione visibile nelle Impostazioni: 2.3.0.
          - Mantiene cifratura streaming per immagini, audio, video e file grandi.
          - Aggiornamento automatico SHA-256 senza reinstallazione.
          "@

          if (gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null) {
            gh release upload $tag ".\dist\SchoolHub.exe#SchoolHub.exe" ".\dist\SchoolHub.exe.sha256.txt#SchoolHub.exe.sha256.txt" --clobber --repo "$env:GITHUB_REPOSITORY"
            gh release edit $tag --title $title --notes $notes --latest --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create $tag ".\dist\SchoolHub.exe#SchoolHub.exe" ".\dist\SchoolHub.exe.sha256.txt#SchoolHub.exe.sha256.txt" --target "$env:GITHUB_SHA" --title $title --notes $notes --latest --repo "$env:GITHUB_REPOSITORY"
          }
