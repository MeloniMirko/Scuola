name: Build SchoolHub Windows EXE

on:
  push:
    branches:
      - schoolhub-build
    paths:
      - ".github/workflows/build-schoolhub.yml"
      - ".schoolhub-v2.1/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify SchoolHub v2 source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $parts = Get-ChildItem ".schoolhub-v2.1\source.part*" | Sort-Object Name
          if ($parts.Count -ne 6) { throw "Expected 6 SchoolHub v2 source parts, got $($parts.Count)" }

          $b64 = [System.Text.StringBuilder]::new()
          foreach ($part in $parts) {
            [void]$b64.Append((Get-Content $part.FullName -Raw).Trim())
          }

          $bytes = [Convert]::FromBase64String($b64.ToString())
          [IO.File]::WriteAllBytes("schoolhub_v2_source.tar.xz", $bytes)

          $actualHash = (Get-FileHash "schoolhub_v2_source.tar.xz" -Algorithm SHA256).Hash.ToLower()
          $expectedHash = "2e6cffe523102548bb43a351cf3008d4ea7cc31c17a37fdecbd1f277affd42e7"
          if ($actualHash -ne $expectedHash) {
            throw "Source bundle SHA256 mismatch: $actualHash"
          }

          tar -xf "schoolhub_v2_source.tar.xz"
          @("src\schoolhub_gui.py","src\workspace.py","src\updater.py","tests\test_schoolhub.py","SchoolHub.spec","VERSION.txt") |
            ForEach-Object { if (!(Test-Path $_)) { throw "Missing source file: $_" } }

      - name: Privacy audit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          import pathlib, re, sys
          root = pathlib.Path(".")
          files = [
              root/"src"/"schoolhub_gui.py",
              root/"src"/"workspace.py",
              root/"src"/"updater.py",
              root/"tests"/"test_schoolhub.py",
          ]
          forbidden = {
              "GitHub PAT": re.compile(r"github_pat_[A-Za-z0-9_]{20,}"),
              "GitHub classic token": re.compile(r"gh[pousr]_[A-Za-z0-9]{20,}"),
              "private key": re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
              "old public data remote": re.compile(r"https://github\.com/MeloniMirko/Scuola\.git", re.I),
          }
          for p in files:
              text = p.read_text(encoding="utf-8")
              for label, pattern in forbidden.items():
                  if pattern.search(text):
                      raise SystemExit(f"Privacy audit failed: {label} found in {p}")
          gui = (root/"src"/"schoolhub_gui.py").read_text(encoding="utf-8")
          if 'DEFAULT_REMOTE = ""' not in gui:
              raise SystemExit("Privacy audit failed: default data remote must be empty")
          if '"auto_sync": False' not in gui:
              raise SystemExit("Privacy audit failed: auto sync must default to false")
          print("Privacy audit OK")
          '@ | Set-Content ".schoolhub-v2.1\privacy_audit.py" -Encoding UTF8
          python ".schoolhub-v2.1\privacy_audit.py"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Bundle Git for Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $gitCmd = (Get-Command git.exe).Source
          $gitRoot = Split-Path (Split-Path $gitCmd -Parent) -Parent
          if (!(Test-Path (Join-Path $gitRoot "cmd\git.exe"))) {
            throw "Could not determine Git for Windows root"
          }
          New-Item -ItemType Directory -Force "vendor" | Out-Null
          Copy-Item $gitRoot "vendor\git" -Recurse -Force
          & "vendor\git\cmd\git.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Git cannot start" }

      - name: Run source test suite
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Source tests failed" }

      - name: Build one-file Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m PyInstaller --clean --noconfirm SchoolHub.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          if (!(Test-Path "dist\SchoolHub.exe")) { throw "SchoolHub.exe was not produced" }
          Get-Item "dist\SchoolHub.exe" | Format-List Name,Length,FullName

      - name: Self-test compiled EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $PWD "dist\selftest.json"
          $p = Start-Process ".\dist\SchoolHub.exe" -ArgumentList @("--self-test", $out) -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            if (Test-Path $out) { Get-Content $out -Raw | Write-Host }
            throw "EXE self-test exited with code $($p.ExitCode)"
          }
          $result = Get-Content $out -Raw | ConvertFrom-Json
          $result | ConvertTo-Json -Depth 8
          if (-not $result.ok) { throw "EXE self-test reported failure" }
          if (-not $result.checks.vault_roundtrip) { throw "Vault round-trip failed" }
          if (-not $result.checks.git_bundled) { throw "EXE did not use bundled Git" }
          if (-not $result.checks.safe_default_remote) { throw "Unsafe default remote" }
          if ($result.checks.version -ne "2.1.0") { throw "Unexpected EXE version" }

      - name: GUI startup smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $p = Start-Process ".\dist\SchoolHub.exe" -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          if ($p.HasExited) {
            throw "SchoolHub GUI exited during startup (code $($p.ExitCode))"
          }
          Stop-Process -Id $p.Id -Force

      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash ".\dist\SchoolHub.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  SchoolHub.exe" | Set-Content ".\dist\SchoolHub.exe.sha256.txt" -Encoding ASCII
          Get-Content ".\dist\SchoolHub.exe.sha256.txt"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolHub-Windows-OneFile-v2.1.0
          path: |
            dist/SchoolHub.exe
            dist/SchoolHub.exe.sha256.txt
            dist/selftest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish auto-update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "schoolhub-v2.1.0"
          $title = "SchoolHub 2.1.0"
          $notes = @"
          SchoolHub 2.1.0

          - Blocca la sincronizzazione verso repository GitHub pubblici.
          - Nessun repository dati preconfigurato e auto-sync disattivata nelle migrazioni pre-v5.
          - Git con timeout: niente sincronizzazioni infinite.
          - Clone shallow per ridurre tempi e traffico.
          - Aggiornamento automatico verificato con SHA-256, senza reinstallazione.\n          - Cifratura SHENC2 a blocchi per immagini, audio, video e file grandi senza caricarli interamente in RAM.\n          - Compatibilità in lettura con i Vault SHENC1 creati dalle versioni precedenti.\n          - Rilevamento di file cifrati troncati o danneggiati.
          - Git for Windows incorporato nell'EXE.
          - 25 test sorgente + self-test EXE + smoke test GUI Windows.
          "@

          if (gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null) {
            gh release upload $tag ".\dist\SchoolHub.exe#SchoolHub.exe" ".\dist\SchoolHub.exe.sha256.txt#SchoolHub.exe.sha256.txt" --clobber --repo "$env:GITHUB_REPOSITORY"
            gh release edit $tag --title $title --notes $notes --latest --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create $tag ".\dist\SchoolHub.exe#SchoolHub.exe" ".\dist\SchoolHub.exe.sha256.txt#SchoolHub.exe.sha256.txt" --target "$env:GITHUB_SHA" --title $title --notes $notes --latest --repo "$env:GITHUB_REPOSITORY"
          }
